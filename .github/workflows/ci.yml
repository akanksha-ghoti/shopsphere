name: ShopSphere Backend CI

on:
push:
branches:
- main
- 'day-04/**'
pull_request:
branches:
- main
- 'day-04/**'

jobs:
backend-quality:
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: server

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm
      cache-dependency-path: server/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Run ESLint
    run: npm run lint

  - name: Run tests
    run: npm test
```
